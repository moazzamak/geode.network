services:
  ray-head:
    image: geode-e7:local
    build:
      context: ../..
      dockerfile: infrastructure/e7/Dockerfile
    command:
      - /bin/bash
      - -lc
      - >-
        ray start --head --port=6379 --ray-client-server-port=10001
        --dashboard-host=0.0.0.0 --block
    ports:
      - "10001:10001"
      - "8265:8265"
    volumes:
      - ../../logs/results/e7_local_shared:/evidence
      - ${GEODE_CACHE_DIR:?set GEODE_CACHE_DIR}:/geode-cache:ro
    environment:
      GEODE_CACHE_DIR: /geode-cache
    healthcheck:
      test: ["CMD-SHELL", "ray status --address=127.0.0.1:6379"]
      interval: 5s
      timeout: 5s
      retries: 20

  ray-worker:
    image: geode-e7:local
    pull_policy: never
    command:
      - /bin/bash
      - -lc
      - ray start --address=ray-head:6379 --block
    depends_on:
      ray-head:
        condition: service_healthy
    volumes:
      - ../../logs/results/e7_local_shared:/evidence
      - ${GEODE_CACHE_DIR:?set GEODE_CACHE_DIR}:/geode-cache:ro
    environment:
      GEODE_CACHE_DIR: /geode-cache
    restart: on-failure